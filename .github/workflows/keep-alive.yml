name: Keep Codespace Alive

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  wake-codespace:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CS_TOKEN }}
      CODESPACE_NAME: solid-funicular-v6x6gwjpj5xjc45x

    steps:
      - name: Start Codespace
        run: |
          gh api -X POST /user/codespaces/$CODESPACE_NAME/start

      - name: Ensure port 8080 is public
        run: |
          gh codespace ports visibility 8080:public -c "$CODESPACE_NAME"
